# BlockProt's Towny plugin integration config.

# When land leaves a town (the mayor unclaims a plot, the town is deleted, or it
# gets ruined) the locks inside are removed: nobody is left to look after them.
cleanup_plots_after_unclaim: true

# Claiming, buying, selling, evicting a plot or changing plot permissions never
# opens a lock: whoever locked a block keeps the lock. A plot clear only removes
# the locks of the block types Towny's plot clear deletes anyway.

# When a resident leaves a town or is kicked, the locks they hold inside it are
# marked. They stay locked to their owner and run out after
# ex_resident_lock_grace_days (config.yml). The mayor and the assistants can take
# them off by hand at once (next setting).
mark_locks_of_leaving_residents: true
town_authority_can_unlock_ex_resident_locks: true

# The mayor and the ranks listed below can take locks off blocks on plots
# that belong to the town (not to a resident), and see who locked them.
town_authority_can_unlock_town_plots: true
town_authority_ranks:
  - assistant

# Restrict the access to residents only. If true, unlocked
# blocks will be only accessible by town residents and only
# residents can be added as friends.
# Blocks however can always only be locked by residents.
# Off: Towny's own plot permissions already decide who may use blocks.
restrict_access_to_residents: false

# This allows any Mayor to view the block info, similarly
# to what the "blockprot.info" permission would do.
allow_mayor_to_see_block_info: true

# Whether or not players are allowed to bypass protections in
# ruined towns.
bypass_protection_in_ruined_towns: true
