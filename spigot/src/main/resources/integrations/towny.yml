# BlockProt's Towny plugin integration config.

# Land events. Locks are never opened because land changes hands, so nobody can
# empty a chest by kicking, evicting, selling or unclaiming around its owner.
#
#  - The town is ruined (Towny makes a ruin public ground): every lock inside is removed.
#  - A plot leaves the town (the mayor unclaims it, the town is deleted, another town
#    overclaims it): the locks inside are marked, see ex_resident_lock_grace_days in
#    config.yml. The owners get that many days, then the locks stop protecting anything.
#  - /plot clear: on a town-owned plot every lock is removed. A resident clearing their
#    own plot removes their own locks (any block type); locks of somebody else's chest in
#    it are only marked. The mayor or an assistant clearing a resident's plot only marks.
cleanup_plots_after_unclaim: true

# A resident who leaves a town or is kicked, or who loses a plot (evicted, sold, handed
# back): the locks he holds there are marked and run out after the same grace period.
# The mayor and the assistants can take such locks off by hand at once (next setting).
# The mark disappears when he joins the town again or claims the plot again.
mark_locks_of_leaving_residents: true
town_authority_can_unlock_ex_resident_locks: true

# The mayor and the ranks listed below can take locks off blocks on plots
# that belong to the town (not to a resident), and see who locked them.
town_authority_can_unlock_town_plots: true
town_authority_ranks:
  - assistant

# Restrict the access to residents only. If true, unlocked
# blocks will be only accessible by town residents and only
# residents can be added as friends.
# Blocks however can always only be locked by residents.
# Off: Towny's own plot permissions already decide who may use blocks.
restrict_access_to_residents: false

# This allows any Mayor to view the block info, similarly
# to what the "blockprot.info" permission would do.
allow_mayor_to_see_block_info: true

# Whether or not players are allowed to bypass protections in
# ruined towns.
bypass_protection_in_ruined_towns: true
